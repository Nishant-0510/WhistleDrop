# WhistleDrop Platform Application Configuration
spring.application.name=whistledrop-backend
server.port=${PORT:8080}

# Default In-Memory / Embedded H2 Database configuration for instant zero-dependency execution & tests
# To use MySQL in production, set SPRING_PROFILES_ACTIVE=mysql or pass environment variables:
# DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:h2:mem:whistledrop;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console (available during development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security & JWT Configuration
# Note: In production, supply JWT_SECRET and MODERATOR_PASSWORD via environment variables
whistledrop.security.jwt.secret=${JWT_SECRET:WhistleDropConfidentialReportingPlatformSuperSecretKey2026SecureString!}
whistledrop.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
whistledrop.security.default-moderator.username=${MODERATOR_USERNAME:admin}
whistledrop.security.default-moderator.password=${MODERATOR_PASSWORD:WhistleDrop2026!Secure}

# OpenAPI / Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# CORS Configuration
whistledrop.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}
