<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="450" fill="url(#bg)" rx="16"/>

  <text x="500" y="60" text-anchor="middle" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="800" font-size="22">Report Status State Transition Machine</text>
  <text x="500" y="90" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13">Validated backend transitions with immutable status update logs</text>

  <!-- Node 1: SUBMITTED -->
  <rect x="80" y="160" width="170" height="70" rx="12" fill="#065f46" stroke="#10b981" stroke-width="2"/>
  <text x="165" y="195" text-anchor="middle" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="14">SUBMITTED</text>
  <text x="165" y="215" text-anchor="middle" fill="#a7f3d0" font-family="'Inter', sans-serif" font-size="11">Initial State</text>

  <!-- Node 2: UNDER_REVIEW -->
  <rect x="410" y="160" width="180" height="70" rx="12" fill="#78350f" stroke="#f59e0b" stroke-width="2"/>
  <text x="500" y="195" text-anchor="middle" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="14">UNDER REVIEW</text>
  <text x="500" y="215" text-anchor="middle" fill="#fde68a" font-family="'Inter', sans-serif" font-size="11">Investigation Active</text>

  <!-- Node 3: RESOLVED -->
  <rect x="740" y="120" width="170" height="70" rx="12" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
  <text x="825" y="155" text-anchor="middle" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="14">RESOLVED</text>
  <text x="825" y="175" text-anchor="middle" fill="#bfdbfe" font-family="'Inter', sans-serif" font-size="11">Action Complete</text>

  <!-- Node 4: DISMISSED -->
  <rect x="740" y="240" width="170" height="70" rx="12" fill="#4c0519" stroke="#f43f5e" stroke-width="2"/>
  <text x="825" y="275" text-anchor="middle" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="14">DISMISSED</text>
  <text x="825" y="295" text-anchor="middle" fill="#fecdd3" font-family="'Inter', sans-serif" font-size="11">Non-actionable / Dup</text>

  <!-- Arrows -->
  <!-- SUBMITTED -> UNDER_REVIEW -->
  <line x1="250" y1="195" x2="400" y2="195" stroke="#10b981" stroke-width="3" stroke-dasharray="6,4"/>
  <polygon points="400,195 390,190 390,200" fill="#10b981"/>

  <!-- UNDER_REVIEW -> RESOLVED -->
  <line x1="590" y1="180" x2="730" y2="155" stroke="#3b82f6" stroke-width="3"/>
  <polygon points="730,155 720,150 722,160" fill="#3b82f6"/>

  <!-- UNDER_REVIEW -> DISMISSED -->
  <line x1="590" y1="210" x2="730" y2="265" stroke="#f43f5e" stroke-width="3"/>
  <polygon points="730,265 722,260 720,270" fill="#f43f5e"/>

  <!-- Fast Dismiss: SUBMITTED -> DISMISSED -->
  <path d="M 210 230 Q 300 330 730 285" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Legend -->
  <rect x="250" y="370" width="500" height="45" rx="8" fill="#090d16" stroke="#334155" stroke-width="1"/>
  <text x="500" y="398" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">
    Every transition logs an immutable entry with status, timestamp, and moderator note.
  </text>
</svg>
