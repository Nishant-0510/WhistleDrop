<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="850" fill="url(#bg)"/>

  <!-- Top Bar -->
  <rect width="1200" height="65" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="60" y="38" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="800" font-size="18">WHISTLEDROP</text>
  <text x="80" y="105" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="13">← Back to All Reports</text>

  <!-- Left Column: Report Full Details -->
  <rect x="80" y="130" width="620" height="660" rx="16" fill="#111827" stroke="#1e293b" stroke-width="1"/>
  
  <text x="110" y="175" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="24">WD-VBEGNAK2</text>
  <rect x="330" y="156" width="85" height="24" rx="12" fill="#3b82f6" fill-opacity="0.2"/>
  <text x="372" y="172" fill="#60a5fa" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="600" font-size="11">SECURITY</text>

  <rect x="425" y="156" width="115" height="24" rx="12" fill="#f59e0b" fill-opacity="0.2"/>
  <text x="482" y="172" fill="#fbbf24" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" font-size="11">UNDER REVIEW</text>

  <text x="110" y="225" fill="#94a3b8" font-family="'Inter', sans-serif" font-weight="600" font-size="12">FULL CONCERN DESCRIPTION</text>
  <rect x="110" y="240" width="560" height="110" rx="10" fill="#1e293b"/>
  <text x="130" y="270" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13">
    <tspan x="130" dy="0">Critical security vulnerability: unauthenticated debug endpoint exposed</tspan>
    <tspan x="130" dy="22">on port 8080. During internal security testing, we discovered that actuator</tspan>
    <tspan x="130" dy="22">endpoints leak environment variables and database config.</tspan>
  </text>

  <text x="110" y="380" fill="#94a3b8" font-family="'Inter', sans-serif" font-weight="600" font-size="12">SUPPORTING EVIDENCE</text>
  <text x="110" y="405" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="13">🔗 https://internal-security.corp/audit/sec-884</text>

  <!-- Complete Audit Timeline -->
  <text x="110" y="460" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="16">Audit &amp; Status History</text>

  <circle cx="125" cy="495" r="7" fill="#f59e0b"/>
  <line x1="125" y1="505" x2="125" y2="570" stroke="#334155" stroke-width="2"/>
  <text x="145" y="495" fill="#fbbf24" font-family="'Inter', sans-serif" font-weight="700" font-size="13">UNDER_REVIEW</text>
  <text x="270" y="495" fill="#64748b" font-family="'Inter', sans-serif" font-size="11">• Oct 04, 18:24</text>
  <text x="145" y="520" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="12">
    "Security operations center has verified the vulnerability and initiated triage."
  </text>

  <circle cx="125" cy="580" r="7" fill="#10b981"/>
  <text x="145" y="580" fill="#34d399" font-family="'Inter', sans-serif" font-weight="700" font-size="13">SUBMITTED</text>
  <text x="250" y="580" fill="#64748b" font-family="'Inter', sans-serif" font-size="11">• Oct 04, 18:23</text>
  <text x="145" y="605" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="12">
    "Report received and queued for confidential review."
  </text>

  <!-- Right Column: Status Update Action Panel / Modal -->
  <rect x="730" y="130" width="390" height="420" rx="16" fill="#111827" stroke="#2563eb" stroke-width="1.5"/>
  
  <text x="760" y="175" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="18">Update Case Status</text>
  <text x="760" y="200" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Select next status and add explanatory note.</text>

  <!-- Status Dropdown / Radio -->
  <text x="760" y="240" fill="#cbd5e1" font-family="'Inter', sans-serif" font-weight="600" font-size="12">NEW STATUS</text>
  <rect x="760" y="255" width="330" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="780" y="280" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13">RESOLVED</text>

  <!-- Message Field -->
  <text x="760" y="325" fill="#cbd5e1" font-family="'Inter', sans-serif" font-weight="600" font-size="12">STATUS NOTE FOR REPORTER</text>
  <rect x="760" y="340" width="330" height="90" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="775" y="365" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12">
    <tspan x="775" dy="0">Actuator endpoint secured and port</tspan>
    <tspan x="775" dy="18">rules updated. Issue resolved.</tspan>
  </text>

  <!-- Submit Status Update Button -->
  <rect x="760" y="455" width="330" height="44" rx="8" fill="#2563eb"/>
  <text x="925" y="482" text-anchor="middle" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="600" font-size="13">Confirm Status Transition →</text>
</svg>
