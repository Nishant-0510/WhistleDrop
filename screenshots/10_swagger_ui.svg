<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b1b1b"/>
      <stop offset="100%" stop-color="#242424"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- Top Swagger Header -->
  <rect width="1200" height="60" fill="#1b1b1b" stroke="#333" stroke-width="1"/>
  <rect x="50" y="15" width="90" height="30" rx="4" fill="#89bf04"/>
  <text x="95" y="35" text-anchor="middle" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="800" font-size="14">swagger</text>
  <text x="160" y="36" fill="#89bf04" font-family="'Inter', sans-serif" font-weight="700" font-size="18">WhistleDrop OpenAPI Specification</text>
  <rect x="1050" y="16" width="90" height="28" rx="4" fill="#4990e2"/>
  <text x="1095" y="34" text-anchor="middle" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="600" font-size="11">Authorize 🔒</text>

  <!-- Title Section -->
  <text x="50" y="110" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="800" font-size="24">WhistleDrop — Confidential Reporting Platform API</text>
  <rect x="710" y="92" width="60" height="22" rx="11" fill="#4990e2" fill-opacity="0.2"/>
  <text x="740" y="107" text-anchor="middle" fill="#4990e2" font-family="'Inter', sans-serif" font-weight="700" font-size="11">1.0.0</text>
  <text x="50" y="135" fill="#999" font-family="'Inter', sans-serif" font-size="13">RESTful API documentation for WhistleDrop anonymous report submission, tracking, and moderator management.</text>
  <text x="50" y="155" fill="#4990e2" font-family="'JetBrains Mono', monospace" font-size="12">Base URL: http://localhost:8080/api</text>

  <!-- Tag 1: Public Reports API -->
  <text x="50" y="205" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="16">Public Reports API</text>

  <!-- Endpoint 1: POST /api/reports -->
  <rect x="50" y="225" width="1100" height="48" rx="4" fill="#e8f6f0" fill-opacity="0.1" stroke="#49cc90" stroke-width="1"/>
  <rect x="60" y="234" width="70" height="30" rx="3" fill="#49cc90"/>
  <text x="95" y="254" text-anchor="middle" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="12">POST</text>
  <text x="145" y="254" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="13">/api/reports</text>
  <text x="320" y="254" fill="#aaa" font-family="'Inter', sans-serif" font-size="12">Submit an anonymous report without account creation</text>

  <!-- Endpoint 2: GET /api/reports/{caseCode} -->
  <rect x="50" y="285" width="1100" height="48" rx="4" fill="#ebf3fb" fill-opacity="0.1" stroke="#61affe" stroke-width="1"/>
  <rect x="60" y="294" width="70" height="30" rx="3" fill="#61affe"/>
  <text x="95" y="314" text-anchor="middle" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="12">GET</text>
  <text x="145" y="314" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="13">/api/reports/{caseCode}</text>
  <text x="400" y="314" fill="#aaa" font-family="'Inter', sans-serif" font-size="12">Track a report and status history by case code</text>

  <!-- Tag 2: Authentication API -->
  <text x="50" y="375" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="16">Authentication API</text>

  <!-- Endpoint 3: POST /api/auth/login -->
  <rect x="50" y="395" width="1100" height="48" rx="4" fill="#e8f6f0" fill-opacity="0.1" stroke="#49cc90" stroke-width="1"/>
  <rect x="60" y="404" width="70" height="30" rx="3" fill="#49cc90"/>
  <text x="95" y="424" text-anchor="middle" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="12">POST</text>
  <text x="145" y="424" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="13">/api/auth/login</text>
  <text x="320" y="424" fill="#aaa" font-family="'Inter', sans-serif" font-size="12">Moderator login &amp; JWT Bearer token generation</text>

  <!-- Tag 3: Moderator Management API -->
  <text x="50" y="485" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="16">Moderator Management API (🔒 Bearer JWT Protected)</text>

  <!-- Endpoint 4: GET /api/moderator/dashboard/stats -->
  <rect x="50" y="505" width="1100" height="48" rx="4" fill="#ebf3fb" fill-opacity="0.1" stroke="#61affe" stroke-width="1"/>
  <rect x="60" y="514" width="70" height="30" rx="3" fill="#61affe"/>
  <text x="95" y="534" text-anchor="middle" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="12">GET</text>
  <text x="145" y="534" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="13">/api/moderator/dashboard/stats</text>
  <text x="440" y="534" fill="#aaa" font-family="'Inter', sans-serif" font-size="12">Get dashboard metrics and category breakdown</text>
  <text x="1100" y="534" fill="#f59e0b" font-size="14">🔒</text>

  <!-- Endpoint 5: GET /api/moderator/reports -->
  <rect x="50" y="565" width="1100" height="48" rx="4" fill="#ebf3fb" fill-opacity="0.1" stroke="#61affe" stroke-width="1"/>
  <rect x="60" y="574" width="70" height="30" rx="3" fill="#61affe"/>
  <text x="95" y="594" text-anchor="middle" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="12">GET</text>
  <text x="145" y="594" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="13">/api/moderator/reports</text>
  <text x="370" y="594" fill="#aaa" font-family="'Inter', sans-serif" font-size="12">Paginated and filtered report list (search, category, status)</text>
  <text x="1100" y="594" fill="#f59e0b" font-size="14">🔒</text>

  <!-- Endpoint 6: PATCH /api/moderator/reports/{caseCode}/status -->
  <rect x="50" y="625" width="1100" height="48" rx="4" fill="#faf5eb" fill-opacity="0.1" stroke="#fca130" stroke-width="1"/>
  <rect x="60" y="634" width="70" height="30" rx="3" fill="#fca130"/>
  <text x="95" y="654" text-anchor="middle" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="12">PATCH</text>
  <text x="145" y="654" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="13">/api/moderator/reports/{caseCode}/status</text>
  <text x="520" y="654" fill="#aaa" font-family="'Inter', sans-serif" font-size="12">Update report status and log message</text>
  <text x="1100" y="654" fill="#f59e0b" font-size="14">🔒</text>
</svg>
