<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="500" fill="url(#bg)" rx="16"/>

  <text x="500" y="80" text-anchor="middle" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="800" font-size="24">Cryptographically Secure Case Code</text>
  <text x="500" y="110" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="14">Generated via java.security.SecureRandom with collision handling</text>

  <!-- Big Code Card -->
  <rect x="150" y="150" width="700" height="180" rx="16" fill="#090d16" stroke="#2563eb" stroke-width="2"/>
  
  <text x="500" y="210" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-weight="600" font-size="14" letter-spacing="2">TRACKING IDENTIFIER</text>
  <text x="500" y="280" text-anchor="middle" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="48" letter-spacing="6">WD-K7M4P9X2</text>

  <g transform="translate(200, 360)">
    <circle cx="20" cy="20" r="12" fill="#10b981" fill-opacity="0.2"/>
    <text x="20" y="24" fill="#10b981" text-anchor="middle" font-weight="700" font-size="12">✓</text>
    <text x="45" y="25" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="13">Unambiguous Character Set (Excludes 0, O, 1, I, L)</text>
  </g>

  <g transform="translate(200, 400)">
    <circle cx="20" cy="20" r="12" fill="#10b981" fill-opacity="0.2"/>
    <text x="20" y="24" fill="#10b981" text-anchor="middle" font-weight="700" font-size="12">✓</text>
    <text x="45" y="25" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="13">Database Unique Constraint Enforced</text>
  </g>
</svg>
