<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>

  <!-- Top Bar -->
  <rect width="1200" height="65" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="60" y="38" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="800" font-size="18">WHISTLEDROP</text>

  <!-- Login Card -->
  <rect x="375" y="120" width="450" height="500" rx="16" fill="#111827" stroke="#1e293b" stroke-width="1"/>

  <!-- Lock Icon -->
  <circle cx="600" cy="180" r="30" fill="#2563eb" fill-opacity="0.15"/>
  <rect x="588" y="174" width="24" height="20" rx="4" fill="#2563eb"/>
  <path d="M593 174 L593 166 Q600 158 607 166 L607 174" fill="none" stroke="#2563eb" stroke-width="3"/>

  <!-- Header -->
  <text x="600" y="240" text-anchor="middle" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="800" font-size="22">Moderator Portal</text>
  <text x="600" y="265" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13">Sign in with authorized administrator credentials</text>

  <!-- Username Field -->
  <text x="415" y="310" fill="#cbd5e1" font-family="'Inter', sans-serif" font-weight="500" font-size="13">Username</text>
  <rect x="415" y="325" width="370" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="435" y="351" fill="#ffffff" font-family="'Inter', sans-serif" font-size="14">admin</text>

  <!-- Password Field -->
  <text x="415" y="395" fill="#cbd5e1" font-family="'Inter', sans-serif" font-weight="500" font-size="13">Password</text>
  <rect x="415" y="410" width="370" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="435" y="436" fill="#ffffff" font-family="'Inter', sans-serif" font-size="14">••••••••••••••••••</text>

  <!-- Sign In Button -->
  <rect x="415" y="480" width="370" height="44" rx="8" fill="#2563eb"/>
  <text x="600" y="507" text-anchor="middle" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="600" font-size="14">Sign In as Moderator →</text>

  <!-- Notice -->
  <rect x="415" y="545" width="370" height="45" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="600" y="572" text-anchor="middle" fill="#64748b" font-family="'Inter', sans-serif" font-size="11">
    Secured with Spring Security &amp; JWT stateless bearer tokens
  </text>
</svg>
