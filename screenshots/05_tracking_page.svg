<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="780" fill="url(#bg)"/>

  <!-- Top Bar -->
  <rect width="1200" height="65" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="60" y="38" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="800" font-size="18">WHISTLEDROP</text>

  <!-- Search Card -->
  <rect x="250" y="90" width="700" height="90" rx="12" fill="#111827" stroke="#1e293b" stroke-width="1"/>
  <rect x="280" y="115" width="460" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="300" y="141" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="14">WD-K7M4P9X2</text>
  <rect x="760" y="115" width="160" height="42" rx="8" fill="#2563eb"/>
  <text x="840" y="141" fill="#ffffff" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="600" font-size="13">Track Report</text>

  <!-- Report Details Header -->
  <rect x="250" y="200" width="700" height="540" rx="16" fill="#111827" stroke="#1e293b" stroke-width="1"/>

  <text x="290" y="240" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="22">WD-K7M4P9X2</text>
  
  <!-- Badges -->
  <rect x="490" y="222" width="90" height="24" rx="12" fill="#3b82f6" fill-opacity="0.2"/>
  <text x="535" y="238" fill="#60a5fa" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" font-size="11">SECURITY</text>

  <rect x="590" y="222" width="120" height="24" rx="12" fill="#eab308" fill-opacity="0.2"/>
  <text x="650" y="238" fill="#facc15" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" font-size="11">UNDER REVIEW</text>

  <!-- Horizontal Timeline Indicator -->
  <g transform="translate(290, 270)">
    <line x1="40" y1="20" x2="580" y2="20" stroke="#334155" stroke-width="3"/>
    
    <!-- SUBMITTED -->
    <circle cx="40" cy="20" r="14" fill="#10b981"/>
    <text x="40" y="24" fill="#ffffff" text-anchor="middle" font-weight="700" font-size="11">✓</text>
    <text x="40" y="50" fill="#cbd5e1" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="600" font-size="11">Submitted</text>

    <!-- UNDER_REVIEW -->
    <circle cx="310" cy="20" r="14" fill="#f59e0b"/>
    <circle cx="310" cy="20" r="6" fill="#ffffff"/>
    <text x="310" y="50" fill="#facc15" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" font-size="11">Under Review</text>

    <!-- RESOLVED -->
    <circle cx="580" cy="20" r="14" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="580" y="50" fill="#64748b" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11">Resolved</text>
  </g>

  <!-- Concern Summary -->
  <rect x="290" y="340" width="620" height="90" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="310" y="365" fill="#94a3b8" font-family="'Inter', sans-serif" font-weight="600" font-size="12">SUBMITTED CONCERN</text>
  <text x="310" y="390" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13">
    Critical security vulnerability: unauthenticated debug endpoint exposed on port 8080.
  </text>
  <text x="310" y="415" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="12">🔗 Evidence: https://internal-security.corp/audit/sec-884</text>

  <!-- Status History Timeline List -->
  <text x="290" y="460" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="16">Status &amp; Moderator Updates History</text>

  <!-- History Item 1 -->
  <circle cx="305" cy="495" r="7" fill="#f59e0b"/>
  <line x1="305" y1="505" x2="305" y2="560" stroke="#334155" stroke-width="2"/>
  <text x="325" y="495" fill="#facc15" font-family="'Inter', sans-serif" font-weight="700" font-size="13">UNDER_REVIEW</text>
  <text x="440" y="495" fill="#64748b" font-family="'Inter', sans-serif" font-size="11">• Today at 18:24</text>
  <text x="325" y="515" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="12">
    "Security operations center has verified the vulnerability and initiated triage."
  </text>

  <!-- History Item 2 -->
  <circle cx="305" cy="570" r="7" fill="#10b981"/>
  <text x="325" y="570" fill="#34d399" font-family="'Inter', sans-serif" font-weight="700" font-size="13">SUBMITTED</text>
  <text x="420" y="570" fill="#64748b" font-family="'Inter', sans-serif" font-size="11">• Today at 18:24</text>
  <text x="325" y="590" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="12">
    "Report received and queued for confidential review."
  </text>
</svg>
