<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1e1e"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>

  <!-- Top Bar -->
  <rect width="1200" height="55" fill="#262626" stroke="#333" stroke-width="1"/>
  <circle cx="40" cy="27" r="14" fill="#ff6c37"/>
  <text x="65" y="34" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="800" font-size="16">POSTMAN</text>
  <text x="160" y="34" fill="#888" font-family="'Inter', sans-serif" font-size="13">WhistleDrop — Confidential Reporting Platform API</text>

  <!-- Left Sidebar (Collection Tree) -->
  <rect x="0" y="55" width="340" height="695" fill="#181818" stroke="#282828" stroke-width="1"/>
  <text x="25" y="90" fill="#fff" font-family="'Inter', sans-serif" font-weight="700" font-size="14">📁 WhistleDrop API Collection</text>

  <!-- Folder 1: Public Endpoints -->
  <text x="35" y="130" fill="#e0e0e0" font-family="'Inter', sans-serif" font-weight="600" font-size="13">▼ 1. Public Endpoints</text>
  
  <rect x="45" y="145" width="45" height="18" rx="3" fill="#ffb400"/>
  <text x="67" y="158" fill="#000" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" font-size="9">POST</text>
  <text x="100" y="159" fill="#ccc" font-family="'Inter', sans-serif" font-size="12">Submit Anonymous Report</text>

  <rect x="45" y="175" width="45" height="18" rx="3" fill="#0cbb52"/>
  <text x="67" y="188" fill="#fff" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" font-size="9">GET</text>
  <text x="100" y="189" fill="#ccc" font-family="'Inter', sans-serif" font-size="12">Track Report by Case Code</text>

  <rect x="45" y="205" width="45" height="18" rx="3" fill="#0cbb52"/>
  <text x="67" y="218" fill="#fff" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" font-size="9">GET</text>
  <text x="100" y="219" fill="#ccc" font-family="'Inter', sans-serif" font-size="12">Track Invalid Case Code (404)</text>

  <!-- Folder 2: Moderator Authentication -->
  <text x="35" y="260" fill="#e0e0e0" font-family="'Inter', sans-serif" font-weight="600" font-size="13">▼ 2. Moderator Authentication</text>
  <rect x="45" y="275" width="45" height="18" rx="3" fill="#ffb400"/>
  <text x="67" y="288" fill="#000" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" font-size="9">POST</text>
  <text x="100" y="289" fill="#ccc" font-family="'Inter', sans-serif" font-size="12">Moderator Login</text>

  <!-- Folder 3: Moderator Protected Operations -->
  <text x="35" y="330" fill="#e0e0e0" font-family="'Inter', sans-serif" font-weight="600" font-size="13">▼ 3. Moderator Operations (🔒)</text>
  
  <rect x="45" y="345" width="45" height="18" rx="3" fill="#0cbb52"/>
  <text x="67" y="358" fill="#fff" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" font-size="9">GET</text>
  <text x="100" y="359" fill="#ccc" font-family="'Inter', sans-serif" font-size="12">Get Dashboard Statistics</text>

  <rect x="45" y="375" width="45" height="18" rx="3" fill="#0cbb52"/>
  <text x="67" y="388" fill="#fff" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" font-size="9">GET</text>
  <text x="100" y="389" fill="#ccc" font-family="'Inter', sans-serif" font-size="12">Get Paginated Reports</text>

  <rect x="45" y="405" width="45" height="18" rx="3" fill="#0cbb52"/>
  <text x="67" y="418" fill="#fff" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" font-size="9">GET</text>
  <text x="100" y="419" fill="#ccc" font-family="'Inter', sans-serif" font-size="12">Filter Reports (Category &amp; Status)</text>

  <rect x="45" y="435" width="45" height="18" rx="3" fill="#0cbb52"/>
  <text x="67" y="448" fill="#fff" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" font-size="9">GET</text>
  <text x="100" y="449" fill="#ccc" font-family="'Inter', sans-serif" font-size="12">Get Report Details</text>

  <rect x="45" y="465" width="45" height="18" rx="3" fill="#a64dff"/>
  <text x="67" y="478" fill="#fff" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" font-size="9">PATCH</text>
  <text x="100" y="479" fill="#ccc" font-family="'Inter', sans-serif" font-size="12">Update Report Status</text>

  <!-- Right Panel: Request & Response Area -->
  <g transform="translate(370, 80)">
    <!-- Request Bar -->
    <rect width="780" height="46" rx="6" fill="#262626" stroke="#383838" stroke-width="1"/>
    <rect x="10" y="8" width="60" height="30" rx="4" fill="#ffb400"/>
    <text x="40" y="27" fill="#000" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="800" font-size="12">POST</text>
    <text x="85" y="28" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="13">http://localhost:8080/api/reports</text>
    <rect x="690" y="8" width="80" height="30" rx="4" fill="#0cbb52"/>
    <text x="730" y="27" fill="#ffffff" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" font-size="12">Send</text>

    <!-- Response Status Bar -->
    <rect y="70" width="780" height="35" rx="4" fill="#1b1b1b"/>
    <text x="15" y="93" fill="#888" font-family="'Inter', sans-serif" font-size="12">Status:</text>
    <text x="60" y="93" fill="#0cbb52" font-family="'Inter', sans-serif" font-weight="700" font-size="12">201 Created</text>
    <text x="160" y="93" fill="#888" font-family="'Inter', sans-serif" font-size="12">Time:</text>
    <text x="200" y="93" fill="#0cbb52" font-family="'Inter', sans-serif" font-size="12">38 ms</text>

    <!-- Response Body Box -->
    <rect y="120" width="780" height="480" rx="8" fill="#181818" stroke="#282828" stroke-width="1"/>
    <text x="20" y="150" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="13">{</text>
    <text x="40" y="175" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12">"success": <tspan fill="#f59e0b">true</tspan>,</text>
    <text x="40" y="200" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12">"message": <tspan fill="#34d399">"Report submitted successfully. Please save your case code."</tspan>,</text>
    <text x="40" y="225" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12">"data": {</text>
    <text x="60" y="250" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12">"caseCode": <tspan fill="#34d399">"WD-K7M4P9X2"</tspan>,</text>
    <text x="60" y="275" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12">"category": <tspan fill="#34d399">"SECURITY"</tspan>,</text>
    <text x="60" y="300" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12">"status": <tspan fill="#34d399">"SUBMITTED"</tspan>,</text>
    <text x="60" y="325" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12">"statusHistory": [</text>
    <text x="80" y="350" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="12">{ "status": "SUBMITTED", "message": "Report received and queued for review." }</text>
    <text x="60" y="375" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12">]</text>
    <text x="40" y="400" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12">}</text>
    <text x="20" y="425" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="13">}</text>
  </g>
</svg>
