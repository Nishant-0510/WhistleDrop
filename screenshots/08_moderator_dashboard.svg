<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- Top Bar -->
  <rect width="1200" height="65" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="60" y="38" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="800" font-size="18">WHISTLEDROP</text>
  <rect x="220" y="22" width="130" height="24" rx="12" fill="#3b82f6" fill-opacity="0.15"/>
  <text x="285" y="38" fill="#60a5fa" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="600" font-size="11">MODERATOR PORTAL</text>

  <!-- Nav Links -->
  <text x="750" y="38" fill="#38bdf8" font-family="'Inter', sans-serif" font-weight="600" font-size="13">Dashboard</text>
  <text x="860" y="38" fill="#94a3b8" font-family="'Inter', sans-serif" font-weight="500" font-size="13">All Reports</text>
  <text x="980" y="38" fill="#ef4444" font-family="'Inter', sans-serif" font-weight="500" font-size="13">Sign Out</text>

  <!-- Page Header -->
  <text x="60" y="120" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="800" font-size="26">Moderator Intelligence Dashboard</text>
  <text x="60" y="145" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13">Real-time confidential report analytics aggregated directly from MySQL/JPA persistence</text>

  <!-- 5 Stat Cards -->
  <!-- Total Reports -->
  <g transform="translate(60, 175)">
    <rect width="200" height="110" rx="12" fill="#111827" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="35" fill="#94a3b8" font-family="'Inter', sans-serif" font-weight="600" font-size="12">TOTAL REPORTS</text>
    <text x="20" y="80" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="800" font-size="36">6</text>
  </g>

  <!-- Submitted -->
  <g transform="translate(280, 175)">
    <rect width="200" height="110" rx="12" fill="#111827" stroke="#10b981" stroke-width="1.5"/>
    <text x="20" y="35" fill="#10b981" font-family="'Inter', sans-serif" font-weight="600" font-size="12">SUBMITTED</text>
    <text x="20" y="80" fill="#34d399" font-family="'Inter', sans-serif" font-weight="800" font-size="36">2</text>
  </g>

  <!-- Under Review -->
  <g transform="translate(500, 175)">
    <rect width="200" height="110" rx="12" fill="#111827" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="20" y="35" fill="#f59e0b" font-family="'Inter', sans-serif" font-weight="600" font-size="12">UNDER REVIEW</text>
    <text x="20" y="80" fill="#fbbf24" font-family="'Inter', sans-serif" font-weight="800" font-size="36">2</text>
  </g>

  <!-- Resolved -->
  <g transform="translate(720, 175)">
    <rect width="200" height="110" rx="12" fill="#111827" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="20" y="35" fill="#3b82f6" font-family="'Inter', sans-serif" font-weight="600" font-size="12">RESOLVED</text>
    <text x="20" y="80" fill="#60a5fa" font-family="'Inter', sans-serif" font-weight="800" font-size="36">1</text>
  </g>

  <!-- Dismissed -->
  <g transform="translate(940, 175)">
    <rect width="200" height="110" rx="12" fill="#111827" stroke="#ef4444" stroke-width="1.5"/>
    <text x="20" y="35" fill="#ef4444" font-family="'Inter', sans-serif" font-weight="600" font-size="12">DISMISSED</text>
    <text x="20" y="80" fill="#f87171" font-family="'Inter', sans-serif" font-weight="800" font-size="36">1</text>
  </g>

  <!-- Recent Submissions Table Card -->
  <rect x="60" y="315" width="1080" height="430" rx="16" fill="#111827" stroke="#1e293b" stroke-width="1"/>
  
  <text x="90" y="355" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="18">Recent Confidential Submissions</text>

  <!-- Table Header -->
  <rect x="90" y="380" width="1020" height="40" rx="8" fill="#1e293b"/>
  <text x="110" y="405" fill="#94a3b8" font-family="'Inter', sans-serif" font-weight="600" font-size="12">CASE CODE</text>
  <text x="290" y="405" fill="#94a3b8" font-family="'Inter', sans-serif" font-weight="600" font-size="12">CATEGORY</text>
  <text x="440" y="405" fill="#94a3b8" font-family="'Inter', sans-serif" font-weight="600" font-size="12">SUMMARY</text>
  <text x="780" y="405" fill="#94a3b8" font-family="'Inter', sans-serif" font-weight="600" font-size="12">STATUS</text>
  <text x="940" y="405" fill="#94a3b8" font-family="'Inter', sans-serif" font-weight="600" font-size="12">ACTION</text>

  <!-- Row 1 -->
  <g transform="translate(90, 430)">
    <text x="20" y="25" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="13">WD-FKEBN5Z9</text>
    <rect x="200" y="8" width="80" height="24" rx="12" fill="#3b82f6" fill-opacity="0.2"/>
    <text x="240" y="24" fill="#60a5fa" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="600" font-size="11">SECURITY</text>
    <text x="350" y="25" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="12">Critical security audit: discovered unprotected sensitive admin endpoint...</text>
    <rect x="690" y="8" width="90" height="24" rx="12" fill="#3b82f6" fill-opacity="0.2"/>
    <text x="735" y="24" fill="#60a5fa" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" font-size="11">RESOLVED</text>
    <rect x="850" y="6" width="70" height="28" rx="6" fill="#2563eb"/>
    <text x="885" y="24" fill="#ffffff" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="600" font-size="11">Review</text>
  </g>

  <!-- Row 2 -->
  <g transform="translate(90, 485)">
    <text x="20" y="25" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="13">WD-VBEGNAK2</text>
    <rect x="200" y="8" width="80" height="24" rx="12" fill="#3b82f6" fill-opacity="0.2"/>
    <text x="240" y="24" fill="#60a5fa" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="600" font-size="11">SECURITY</text>
    <text x="350" y="25" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="12">Critical security vulnerability: unauthenticated debug endpoint exposed on port 8080</text>
    <rect x="690" y="8" width="110" height="24" rx="12" fill="#f59e0b" fill-opacity="0.2"/>
    <text x="745" y="24" fill="#fbbf24" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" font-size="11">UNDER REVIEW</text>
    <rect x="850" y="6" width="70" height="28" rx="6" fill="#2563eb"/>
    <text x="885" y="24" fill="#ffffff" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="600" font-size="11">Review</text>
  </g>

  <!-- Row 3 -->
  <g transform="translate(90, 540)">
    <text x="20" y="25" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="13">WD-H4N6X8C1</text>
    <rect x="200" y="8" width="95" height="24" rx="12" fill="#ef4444" fill-opacity="0.2"/>
    <text x="247" y="24" fill="#f87171" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="600" font-size="11">CORRUPTION</text>
    <text x="350" y="25" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="12">Vendor selection process for campus event hardware procurement bypassed bidding...</text>
    <rect x="690" y="8" width="90" height="24" rx="12" fill="#10b981" fill-opacity="0.2"/>
    <text x="735" y="24" fill="#34d399" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" font-size="11">SUBMITTED</text>
    <rect x="850" y="6" width="70" height="28" rx="6" fill="#2563eb"/>
    <text x="885" y="24" fill="#ffffff" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="600" font-size="11">Review</text>
  </g>
</svg>
