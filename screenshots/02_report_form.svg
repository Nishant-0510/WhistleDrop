<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>

  <!-- Top Bar -->
  <rect width="1200" height="65" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="60" y="38" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="800" font-size="18">WHISTLEDROP</text>

  <!-- Step Wizard Indicator -->
  <g transform="translate(300, 100)">
    <circle cx="50" cy="20" r="16" fill="#2563eb"/>
    <text x="50" y="25" fill="#ffffff" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" font-size="13">1</text>
    <text x="50" y="55" fill="#ffffff" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="600" font-size="12">Category</text>

    <line x1="80" y1="20" x2="270" y2="20" stroke="#334155" stroke-width="2"/>

    <circle cx="300" cy="20" r="16" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="300" y="25" fill="#94a3b8" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" font-size="13">2</text>
    <text x="300" y="55" fill="#94a3b8" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="500" font-size="12">Description</text>

    <line x1="330" y1="20" x2="520" y2="20" stroke="#334155" stroke-width="2"/>

    <circle cx="550" cy="20" r="16" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="550" y="25" fill="#94a3b8" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" font-size="13">3</text>
    <text x="550" y="55" fill="#94a3b8" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="500" font-size="12">Review</text>
  </g>

  <!-- Form Container Card -->
  <rect x="250" y="190" width="700" height="500" rx="16" fill="#111827" stroke="#1e293b" stroke-width="1"/>
  
  <text x="290" y="240" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="20">Step 1 — Select Category</text>
  <text x="290" y="265" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13">Choose the category that best describes your confidential report.</text>

  <!-- Category Options Grid -->
  <!-- Option 1: SECURITY (Selected) -->
  <rect x="290" y="295" width="295" height="75" rx="10" fill="#1e293b" stroke="#2563eb" stroke-width="2"/>
  <text x="315" y="330" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="15">SECURITY</text>
  <text x="315" y="350" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Data breaches, vulnerabilities, exploits</text>

  <!-- Option 2: HARASSMENT -->
  <rect x="615" y="295" width="295" height="75" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="640" y="330" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="15">HARASSMENT</text>
  <text x="640" y="350" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Hostility, abuse, workplace safety</text>

  <!-- Option 3: CORRUPTION -->
  <rect x="290" y="385" width="295" height="75" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="315" y="420" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="15">CORRUPTION</text>
  <text x="315" y="440" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Bribery, fraud, ethics violation</text>

  <!-- Option 4: TECHNICAL -->
  <rect x="615" y="385" width="295" height="75" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="640" y="420" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="15">TECHNICAL</text>
  <text x="640" y="440" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">System integrity, downtime, bugs</text>

  <!-- Option 5: OTHER -->
  <rect x="290" y="475" width="620" height="65" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="315" y="505" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="15">OTHER</text>
  <text x="315" y="525" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Any other matter requiring confidential review</text>

  <!-- Bottom Privacy Banner & Next Button -->
  <rect x="290" y="560" width="620" height="40" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="310" y="585" fill="#10b981" font-family="'Inter', sans-serif" font-weight="500" font-size="12">🔒 Zero reporter identification: No name, email, or account required.</text>

  <rect x="730" y="620" width="180" height="44" rx="8" fill="#2563eb"/>
  <text x="820" y="647" fill="#ffffff" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="600" font-size="13">Continue to Description →</text>
</svg>
