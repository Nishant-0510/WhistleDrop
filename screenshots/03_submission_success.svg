<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>

  <!-- Top Bar -->
  <rect width="1200" height="65" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="60" y="38" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="800" font-size="18">WHISTLEDROP</text>

  <!-- Success Card -->
  <rect x="300" y="110" width="600" height="520" rx="16" fill="#111827" stroke="#1e293b" stroke-width="1"/>

  <!-- Success Icon -->
  <circle cx="600" cy="180" r="32" fill="#10b981" fill-opacity="0.15"/>
  <circle cx="600" cy="180" r="24" fill="#10b981"/>
  <path d="M592 180 L598 186 L610 174" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Success Title -->
  <text x="600" y="240" text-anchor="middle" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="800" font-size="22">Your Report Has Been Submitted</text>
  <text x="600" y="265" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13">No account was created. Your case code is your only tracking key.</text>

  <!-- Case Code Highlight Box -->
  <rect x="340" y="295" width="520" height="120" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="600" y="330" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-weight="600" font-size="12" letter-spacing="1">YOUR UNIQUE CASE CODE</text>
  <text x="600" y="375" text-anchor="middle" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="32" letter-spacing="3">WD-K7M4P9X2</text>

  <!-- Warning Banner -->
  <rect x="340" y="435" width="520" height="50" rx="8" fill="#451a03" stroke="#b45309" stroke-width="1"/>
  <text x="360" y="465" fill="#fde68a" font-family="'Inter', sans-serif" font-weight="600" font-size="12">⚠️ Save this code now. It cannot be recovered if lost.</text>

  <!-- Action Buttons -->
  <rect x="340" y="510" width="250" height="44" rx="8" fill="#2563eb"/>
  <text x="465" y="537" text-anchor="middle" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="600" font-size="13">📋 Copy Case Code</text>

  <rect x="610" y="510" width="250" height="44" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="735" y="537" text-anchor="middle" fill="#f8fafc" font-family="'Inter', sans-serif" font-weight="600" font-size="13">Track Report Now →</text>
</svg>
