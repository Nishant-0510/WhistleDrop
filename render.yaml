services:
  - type: web
    name: whistledrop-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: whistledrop-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: MODERATOR_USERNAME
        sync: false
      - key: MODERATOR_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

databases:
  - name: whistledrop-db
    plan: free
    databaseName: whistledrop
    user: whistledrop
